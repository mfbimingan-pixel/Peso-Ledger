<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Peso Ledger">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFE27A">
<meta name="color-scheme" content="light">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23FFE27A'/%3E%3Ccircle cx='90' cy='90' r='56' fill='%23FF8FB1'/%3E%3Ctext x='90' y='116' font-size='76' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3E%E2%82%B1%3C/text%3E%3C/svg%3E">
<title>Peso Ledger</title>
<style>
:root{--y:#FFE27A;--p:#FF8FB1;--pd:#D94F80;--bg:#FFF8E1;--ink:#3B2A33;--mut:#8A7480;--card:#fff;--ok:#3E9B6B;--warn:#E8A317;--bad:#D63A4A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header{background:var(--y);padding:14px 18px 12px;border-radius:0 0 26px 26px}
h1{margin:0;font-size:22px}header p{margin:2px 0 0;font-size:13px;color:#7a5a2a}
main{padding:14px;max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;border:2px solid #FFE9A8}
h2{font-size:16px;margin:0 0 10px}
.big{font-size:30px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:14px;padding:10px}.stat small{color:var(--mut);display:block}.stat b{font-size:18px}
.mut{color:var(--mut);font-size:13px}
.bar{height:10px;background:#F3E7C8;border-radius:9px;overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.in{color:var(--ok)}.out{color:var(--pd)}
button,select,input{font:inherit;color:var(--ink)}
.btn{background:var(--p);color:#fff;border:0;border-radius:14px;padding:11px 16px;font-weight:700}
.btn.alt{background:var(--y);color:var(--ink)}.btn.sm{padding:6px 11px;font-size:14px}
.btn.ghost{background:#fff;border:2px solid var(--p);color:var(--pd)}
input,select{width:100%;padding:11px;border:2px solid #F0DFA8;border-radius:12px;background:#fff;margin:4px 0 10px}
label{font-size:13px;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid #FFE9A8;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;padding:8px 2px;border-radius:14px;font-size:13px;color:var(--mut)}
nav button b{display:block;font-size:20px;font-weight:400}
nav button.on{background:var(--y);color:var(--ink);font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));border-radius:50%;width:56px;height:56px;font-size:30px;padding:0;box-shadow:0 4px 12px #0003}
.item{padding:10px 0;border-bottom:1px solid #F5EBCB}.item:last-child{border:0}
.tag{font-size:12px;background:#FFE9A8;border-radius:8px;padding:2px 7px;margin-left:4px}
.tag.bad{background:#FFD3D8;color:var(--bad)}
#m{position:fixed;inset:0;background:#3B2A3399;display:none;align-items:flex-end;z-index:9}
#m.on{display:flex}
#sheet{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.budrow{display:grid;grid-template-columns:1fr 100px 34px;gap:6px;align-items:center}.budrow input{margin:2px 0}
.x{border:0;background:none;font-size:20px;color:var(--mut)}
</style></head><body>
<header><h1>♡ Peso Ledger</h1><p id="sub"></p></header>
<main id="app"></main>
<button class="btn fab" id="fab" aria-label="Add">+</button>
<nav id="nav">
<button data-t="dash"><b>🏠</b>Dashboard</button>
<button data-t="tx"><b>🧾</b>Transactions</button>
<button data-t="debt"><b>💳</b>Loans &amp; Cards</button>
</nav>
<div id="m"><div id="sheet"></div></div>
<script>
const K='pesoLedgerV1';
const DEF=()=>({tx:[],loans:[],cards:[],budgets:[{cat:'Groceries',limit:5000},{cat:'Meralco',limit:3000},{cat:'Water',limit:500},{cat:'Load & Internet',limit:1500},{cat:'Padala',limit:3000}]});
let S;try{S=JSON.parse(localStorage.getItem(K))||DEF()}catch(e){S=DEF()}
let tab='dash',storageOK=true;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){storageOK=false}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const sum=a=>a.reduce((s,x)=>s+(+x.amt||0),0);
const loanBal=l=>Math.max(0,l.total-sum(S.tx.filter(t=>t.type==='loan'&&t.ref===l.id)));
const cardBal=c=>Math.max(0,sum(S.tx.filter(t=>t.type==='expense'&&t.ref===c.id))+(+c.start||0)-sum(S.tx.filter(t=>t.type==='card'&&t.ref===c.id)));
const nth=n=>n+(['th','st','nd','rd'][(n%100>>3^1&&n%10<4)?n%10:0]||'th');

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#sub').textContent=new Date().toLocaleDateString('en-PH',{month:'long',year:'numeric'})+(storageOK?'':' · not saving, check Safari settings');
  $('#fab').style.display=tab==='dash'?'none':'block';
  $('#app').innerHTML={dash:dash,tx:txList,debt:debt}[tab]();
}

function dash(){
  const ym=today().slice(0,7),m=S.tx.filter(t=>t.date.startsWith(ym));
  const inc=sum(m.filter(t=>t.type==='income')),exp=sum(m.filter(t=>t.type==='expense'));
  const cardSpend=sum(m.filter(t=>t.type==='expense'&&t.ref));
  const paid=sum(m.filter(t=>t.type==='loan'||t.type==='card'));
  const left=inc-(exp-cardSpend)-paid;
  const owed=S.loans.filter(l=>l.kind==='borrowed').reduce((s,l)=>s+loanBal(l),0)+S.cards.reduce((s,c)=>s+cardBal(c),0);
  const owedMe=S.loans.filter(l=>l.kind==='lent').reduce((s,l)=>s+loanBal(l),0);
  let h=`<div class="card"><div class="mut">Left this month</div><div class="big ${left<0?'out':''}">${fmt(left)}</div>
  <div class="grid" style="margin-top:10px"><div class="stat"><small>Income</small><b class="in">${fmt(inc)}</b></div><div class="stat"><small>Expenses</small><b class="out">${fmt(exp)}</b></div>
  <div class="stat"><small>Loan &amp; card payments</small><b>${fmt(paid)}</b></div><div class="stat"><small>You still owe</small><b>${fmt(owed)}</b></div></div>
  ${owedMe?`<p class="mut" style="margin:10px 0 0">Others owe you ${fmt(owedMe)}</p>`:''}</div>`;
  h+=`<div class="card"><h2>My budget</h2>`;
  S.budgets.forEach((b,i)=>{
    const sp=sum(m.filter(t=>t.type==='expense'&&t.cat===b.cat)),pct=b.limit>0?sp/b.limit*100:0;
    h+=`<div class="item"><div class="row"><b>${esc(b.cat)}</b><span class="${pct>100?'out':''}">${fmt(sp)} / ${fmt(b.limit)}</span></div>
    <div class="bar"><i style="width:${Math.min(100,pct)}%;background:${pct>100?'var(--bad)':pct>80?'var(--warn)':'var(--ok)'}"></i></div>
    <div class="mut">${pct>100?'Over by '+fmt(sp-b.limit):fmt(b.limit-sp)+' left'}</div></div>`;});
  h+=`<button class="btn alt" style="margin-top:8px" onclick="editBudgets()">Edit budget</button></div>`;
  const dues=[...S.loans.filter(l=>l.kind==='borrowed'&&loanBal(l)>0&&l.due).map(l=>({n:l.name,d:l.due,a:l.monthly})),...S.cards.filter(c=>cardBal(c)>0&&c.due).map(c=>({n:c.name+' card',d:c.due,a:null}))];
  if(dues.length){const day=new Date().getDate();h+=`<div class="card"><h2>Bills due</h2>`+dues.sort((a,b)=>a.d-b.d).map(x=>`<div class="item row"><span>${esc(x.n)}${x.d<day?'<span class="tag bad">passed this month</span>':''}</span><span class="mut">every ${nth(+x.d)}${x.a?' · '+fmt(x.a):''}</span></div>`).join('')+`</div>`;}
  h+=`<div class="card"><h2>Backup</h2><p class="mut" style="margin-top:0">Your data lives on this phone. Download a backup now and then.</p>
  <button class="btn ghost sm" onclick="exportData()">Download backup</button> <button class="btn ghost sm" onclick="$('#imp').click()">Restore</button>
  <input type="file" id="imp" accept=".json,application/json" hidden onchange="importData(this)"></div>`;
  return h;
}

function txList(){
  if(!S.tx.length)return `<div class="card"><h2>No transactions yet</h2><p class="mut">Tap + to add your first expense or income.</p></div>`;
  const nm=t=>t.type==='loan'?(S.loans.find(l=>l.id===t.ref)||{}).name:t.type==='card'?(S.cards.find(c=>c.id===t.ref)||{}).name:t.cat;
  return `<div class="card">`+[...S.tx].sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id)).map(t=>{
    const inc=t.type==='income',c=t.type==='expense'&&t.ref?(S.cards.find(x=>x.id===t.ref)||{}).name:'';
    return `<div class="item row" onclick="delTx('${t.id}')"><div><b>${esc(nm(t)||'—')}</b>${t.type==='loan'?'<span class="tag">loan</span>':t.type==='card'?'<span class="tag">card payment</span>':''}${c?`<span class="tag">${esc(c)}</span>`:''}
    <div class="mut">${t.date}${t.note?' · '+esc(t.note):''}</div></div><b class="${inc?'in':'out'}">${inc?'+':'−'}${fmt(t.amt)}</b></div>`}).join('')+`<p class="mut" style="margin-bottom:0">Tap a row to delete it.</p></div>`;
}

function debt(){
  let h=`<div class="card"><h2>Loans</h2>`;
  if(!S.loans.length)h+=`<p class="mut">No loans yet. Tap + to add one.</p>`;
  S.loans.forEach(l=>{const b=loanBal(l),pct=l.total?(1-b/l.total)*100:0,left=l.monthly>0?Math.ceil(b/l.monthly):0;
    h+=`<div class="item"><div class="row"><b>${esc(l.name)}<span class="tag">${l.kind==='lent'?'pautang':'utang'}</span></b><b>${fmt(b)}</b></div>
    <div class="bar"><i style="width:${pct}%"></i></div><div class="mut">${b<=0?'Fully paid ✓':`${fmt(l.monthly)}/month · about ${left} payments left${l.due?' · due every '+nth(+l.due):''}`}</div>
    <div style="margin-top:6px"><button class="btn sm alt" onclick="addTx('loan','${l.id}')">Log payment</button> <button class="x" onclick="delItem('loans','${l.id}')">🗑</button></div></div>`});
  h+=`</div><div class="card"><h2>Credit cards</h2>`;
  if(!S.cards.length)h+=`<p class="mut">No cards yet. Tap + to add one.</p>`;
  S.cards.forEach(c=>{const b=cardBal(c),pct=c.limit?b/c.limit*100:0;
    h+=`<div class="item"><div class="row"><b>${esc(c.name)}</b><b>${fmt(b)}</b></div>
    <div class="bar"><i style="width:${Math.min(100,pct)}%;background:${pct>80?'var(--bad)':pct>50?'var(--warn)':'var(--ok)'}"></i></div>
    <div class="mut">${pct.toFixed(0)}% of ${fmt(c.limit)} used · ${fmt(Math.max(0,c.limit-b))} available${c.due?' · due every '+nth(+c.due):''}</div>
    ${c.rate&&b>0?`<div class="mut">If unpaid, about ${fmt(b*c.rate/100)} interest next month</div>`:''}
    <div style="margin-top:6px"><button class="btn sm alt" onclick="addTx('card','${c.id}')">Log payment</button> <button class="x" onclick="delItem('cards','${c.id}')">🗑</button></div></div>`});
  return h+`</div>`;
}

function open(html){$('#sheet').innerHTML=html;$('#m').classList.add('on')}
function close(){$('#m').classList.remove('on')}
$('#m').addEventListener('click',e=>{if(e.target.id==='m')close()});
const v=id=>$('#'+id).value;
const num=id=>Math.max(0,parseFloat(v(id))||0);

function addTx(type='expense',ref=''){
  const cats=[...new Set([...S.budgets.map(b=>b.cat),...S.tx.map(t=>t.cat).filter(Boolean)])];
  open(`<h2>Add transaction</h2>
  <label>Type</label><select id="f_type" onchange="txFields()"><option value="expense">Expense</option><option value="income">Income</option><option value="loan">Loan payment</option><option value="card">Card payment</option></select>
  <label>Amount (₱)</label><input id="f_amt" type="number" inputmode="decimal" step="0.01" placeholder="0.00">
  <label>Date</label><input id="f_date" type="date" value="${today()}">
  <div id="f_dyn"></div>
  <label>Note (optional)</label><input id="f_note">
  <div class="row"><button class="btn ghost" onclick="close()">Cancel</button><button class="btn" onclick="saveTx()">Save</button></div>`);
  $('#f_type').value=type;window._ref=ref;window._cats=cats;txFields();
}
function txFields(){
  const t=v('f_type'),opt=(a,sel)=>a.map(x=>`<option value="${x.id}" ${x.id===window._ref?'selected':''}>${esc(x.name)}</option>`).join('');
  let h='';
  if(t==='expense')h=`<label>Category</label><input id="f_cat" list="cl" placeholder="e.g. Groceries"><datalist id="cl">${window._cats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    <label>Paid with</label><select id="f_ref"><option value="">Cash / debit</option>${opt(S.cards)}</select>`;
  else if(t==='income')h=`<label>Source</label><input id="f_cat" placeholder="e.g. Salary">`;
  else{const a=t==='loan'?S.loans:S.cards;h=a.length?`<label>${t==='loan'?'Which loan':'Which card'}</label><select id="f_ref">${opt(a)}</select>`:`<p class="out">Add a ${t==='loan'?'loan':'card'} first in Loans &amp; Cards.</p>`}
  $('#f_dyn').innerHTML=h;
}
function saveTx(){
  const type=v('f_type'),amt=num('f_amt');
  if(!amt)return alert('Enter an amount.');
  const ref=$('#f_ref')?v('f_ref'):'',cat=$('#f_cat')?v('f_cat').trim():'';
  if((type==='loan'||type==='card')&&!ref)return alert('Choose which one you are paying.');
  if((type==='expense'||type==='income')&&!cat)return alert('Enter a category.');
  S.tx.push({id:uid(),type,amt,date:v('f_date')||today(),cat,ref,note:v('f_note').trim()});
  save();close();render();
}
function delTx(id){if(confirm('Delete this transaction?')){S.tx=S.tx.filter(t=>t.id!==id);save();render()}}
function delItem(k,id){if(confirm('Delete this? Its payments stay in Transactions.')){S[k]=S[k].filter(x=>x.id!==id);save();render()}}

function addDebt(){
  open(`<h2>Add loan or card</h2><div class="row" style="margin-bottom:10px"><button class="btn" id="b1" onclick="debtForm('loan')">Loan</button><button class="btn alt" id="b2" onclick="debtForm('card')">Credit card</button></div><div id="d_dyn"></div>`);debtForm('loan');
}
function debtForm(k){
  $('#b1').className='btn'+(k==='loan'?'':' alt');$('#b2').className='btn'+(k==='card'?'':' alt');
  $('#d_dyn').innerHTML=k==='loan'?`<label>Name</label><input id="d_name" placeholder="e.g. SSS salary loan">
  <label>Kind</label><select id="d_kind"><option value="borrowed">I borrowed (utang)</option><option value="lent">I lent (pautang)</option></select>
  <label>Total to repay, with interest (₱)</label><input id="d_total" type="number" inputmode="decimal">
  <label>Monthly payment (₱)</label><input id="d_mo" type="number" inputmode="decimal">
  <label>Due day of month (1–31, optional)</label><input id="d_due" type="number" inputmode="numeric" min="1" max="31">
  <div class="row"><button class="btn ghost" onclick="close()">Cancel</button><button class="btn" onclick="saveDebt('loan')">Save</button></div>`
  :`<label>Card name</label><input id="d_name" placeholder="e.g. BankCom">
  <label>Credit limit (₱)</label><input id="d_limit" type="number" inputmode="decimal">
  <label>Current balance (₱)</label><input id="d_start" type="number" inputmode="decimal" placeholder="0">
  <label>Due day of month (1–31)</label><input id="d_due" type="number" inputmode="numeric" min="1" max="31">
  <label>Interest per month, % (optional)</label><input id="d_rate" type="number" inputmode="decimal" step="0.01">
  <div class="row"><button class="btn ghost" onclick="close()">Cancel</button><button class="btn" onclick="saveDebt('card')">Save</button></div>`;
}
function saveDebt(k){
  const name=v('d_name').trim();if(!name)return alert('Enter a name.');
  if(k==='loan'){if(!num('d_total'))return alert('Enter the total to repay.');S.loans.push({id:uid(),name,kind:v('d_kind'),total:num('d_total'),monthly:num('d_mo'),due:num('d_due')||''})}
  else{if(!num('d_limit'))return alert('Enter the credit limit.');S.cards.push({id:uid(),name,limit:num('d_limit'),start:num('d_start'),due:num('d_due')||'',rate:num('d_rate')})}
  save();close();render();
}

function editBudgets(){
  open(`<h2>Edit budget</h2><p class="mut" style="margin-top:0">Monthly limit per category.</p><div id="bl"></div>
  <button class="btn alt sm" onclick="S.budgets.push({cat:'',limit:0});bRows()">+ Add category</button>
  <div class="row" style="margin-top:14px"><button class="btn ghost" onclick="close()">Cancel</button><button class="btn" onclick="saveBudgets()">Save</button></div>`);bRows();
}
function bRows(){
  const cur=[...document.querySelectorAll('.bc')].map((e,i)=>({cat:e.value,limit:+document.querySelectorAll('.bm')[i].value||0}));
  if(cur.length===S.budgets.length)S.budgets=cur.map((x,i)=>x);
  $('#bl').innerHTML=S.budgets.map((b,i)=>`<div class="budrow"><input class="bc" value="${esc(b.cat)}" placeholder="Category"><input class="bm" type="number" inputmode="decimal" value="${b.limit}"><button class="x" onclick="S.budgets.splice(${i},1);bRows()">✕</button></div>`).join('');
}
function saveBudgets(){
  S.budgets=[...document.querySelectorAll('.bc')].map((e,i)=>({cat:e.value.trim(),limit:+document.querySelectorAll('.bm')[i].value||0})).filter(b=>b.cat);
  save();close();render();
}

function exportData(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
  a.download='peso-ledger-backup-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();
}
function importData(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.tx||!d.loans||!d.cards||!d.budgets)throw 0;if(confirm('Replace current data with this backup?')){S=d;save();render()}}catch(e){alert('That file is not a Peso Ledger backup.')}};
  r.readAsText(f);
}

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)});
$('#fab').onclick=()=>tab==='debt'?addDebt():addTx();
render();
</script></body></html>
